name: moodle-toolkit-quality

x-environment: &environment
    APP_ENV: testing
    APP_DEBUG: 'false'
    APP_KEY: ${QUALITY_APP_KEY:?Run tests/Infrastructure/run-quality.ps1}
    APP_URL: http://localhost:8080
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_DATABASE: moodle_toolkit_e2e
    DB_USERNAME: quality
    DB_PASSWORD: ${QUALITY_DB_PASSWORD:?Run tests/Infrastructure/run-quality.ps1}
    SESSION_DRIVER: database
    SESSION_SECURE_COOKIE: 'false'
    SESSION_LIFETIME: 120
    BCRYPT_ROUNDS: 4
    CACHE_STORE: redis
    REDIS_HOST: redis
    QUEUE_CONNECTION: redis
    BROADCAST_CONNECTION: reverb
    REVERB_APP_ID: quality
    REVERB_APP_KEY: quality-key
    REVERB_APP_SECRET: ${QUALITY_REVERB_SECRET:?Run tests/Infrastructure/run-quality.ps1}
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    REVERB_SCHEME: http
    MAIL_MAILER: array
    QUALITY_HARNESS: '1'

x-app: &app
    image: moodle-toolkit-quality:local
    build:
        context: .
        dockerfile: docker/php/Dockerfile
        target: quality
    environment: *environment
    volumes:
        - quality_storage:/var/www/html/storage
        - ./BaseLine:/var/www/html/BaseLine:ro
    depends_on:
        postgres:
            condition: service_healthy
        redis:
            condition: service_healthy

services:
    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: moodle_toolkit_e2e
            POSTGRES_USER: quality
            POSTGRES_PASSWORD: ${QUALITY_DB_PASSWORD}
        tmpfs: [/var/lib/postgresql/data]
        healthcheck:
            test: [CMD-SHELL, 'pg_isready -U quality -d moodle_toolkit_e2e']
            interval: 2s
            timeout: 5s
            retries: 30
    postgres-testing:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: moodle_toolkit_testing
            POSTGRES_USER: moodle_toolkit_testing
            POSTGRES_PASSWORD: local_testing_only
        tmpfs: [/var/lib/postgresql/data]
        healthcheck:
            test: [CMD-SHELL, 'pg_isready -U moodle_toolkit_testing']
            interval: 2s
            timeout: 5s
            retries: 30
    redis:
        image: redis:7.4-alpine
        healthcheck:
            test: [CMD, redis-cli, ping]
            interval: 2s
            timeout: 5s
            retries: 30
    app:
        <<: *app
        command:
            [
                sh,
                -c,
                'mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs && chown -R www-data:www-data storage && exec php-fpm',
            ]
        healthcheck:
            test: [CMD, php, artisan, about, --only=environment]
            interval: 5s
            timeout: 10s
            retries: 30
    queue-worker:
        <<: *app
        user: www-data
        command: [php, tests/Support/quality-worker.php]
        healthcheck:
            test: [CMD, php, tests/Support/quality-control.php, worker-health]
            interval: 5s
            timeout: 10s
            retries: 30
        depends_on:
            app:
                condition: service_healthy
    scheduler:
        <<: *app
        user: www-data
        command: [php, artisan, schedule:work, --no-interaction]
        healthcheck:
            test: [CMD-SHELL, "grep -aq 'schedule:work' /proc/1/cmdline"]
            interval: 5s
            timeout: 5s
            retries: 30
    reverb:
        <<: *app
        user: www-data
        restart: unless-stopped
        command: [php, artisan, reverb:start, --host=0.0.0.0, --port=8080]
        healthcheck:
            test: [CMD, php, -r, "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
            interval: 5s
            timeout: 5s
            retries: 30
    vite:
        <<: *app
        command: [npm, run, dev, --, --host, 0.0.0.0]
        healthcheck:
            test:
                [
                    CMD,
                    node,
                    -e,
                    "fetch('http://localhost:5173/@vite/client').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
                ]
            interval: 5s
            timeout: 5s
            retries: 30
    mailpit:
        image: axllent/mailpit:v1.27
        healthcheck:
            test: [CMD, /mailpit, readyz]
            interval: 5s
            timeout: 5s
            retries: 30
    nginx:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: quality-nginx
        volumes:
            - ./BaseLine:/var/www/html/BaseLine:ro
        depends_on:
            app:
                condition: service_healthy
            reverb:
                condition: service_healthy
        healthcheck:
            test:
                [
                    CMD,
                    wget,
                    --quiet,
                    --spider,
                    'http://127.0.0.1:8080/nginx-health',
                ]
            interval: 5s
            timeout: 5s
            retries: 30
    playwright:
        profiles: [e2e]
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: e2e
        environment: *environment
        network_mode: service:nginx
        init: true
        shm_size: 1gb
        volumes:
            - quality_storage:/var/www/html/storage
            - ./quality-results:/var/www/html/quality-results
        command: [npm, run, test:e2e]

volumes:
    quality_storage:
