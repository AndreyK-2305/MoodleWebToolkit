# Synthetic Moodle source on an EC2 laboratory instance. Installed under
# /opt/moodle-lab/runtime by provision.sh; never used by the web platform stack.
name: moodle-lab

services:
    moodle-lab-db:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: moodle_lab
            POSTGRES_USER: moodle_lab
            POSTGRES_PASSWORD_FILE: /run/secrets/moodle-lab-db
        secrets: [moodle-lab-db]
        volumes:
            - pgdata:/var/lib/postgresql/data
        # Reachable from the host for the Collector, never from the network.
        ports: ['127.0.0.1:5432:5432']
        restart: unless-stopped
        healthcheck:
            test: [CMD-SHELL, 'pg_isready -U moodle_lab -d moodle_lab']
            interval: 5s
            timeout: 5s
            retries: 30

    php:
        build:
            context: .
            dockerfile: php.Dockerfile
        image: moodle-lab-php:8.3
        user: '33:33'
        working_dir: /opt/moodle-lab/code
        volumes:
            - /opt/moodle-lab:/opt/moodle-lab
        depends_on:
            moodle-lab-db:
                condition: service_healthy
        profiles: [tools]

secrets:
    moodle-lab-db:
        file: /opt/moodle-lab/secrets/moodle-lab-db

volumes:
    pgdata:
