server {
    listen 8080;
    server_name localhost;
    root /var/www/html/public;
    index index.php;
    location = /nginx-health { return 200 "ok\n"; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass app:9000;
        # Laravel sends a Link header with every Vite chunk a page preloads; with the
        # cookies it outgrows the default 4k buffer and nginx answers 502.
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }
}
server {
    listen 8081;
    resolver ${NGINX_LOCAL_RESOLVERS} valid=2s ipv6=off;
    resolver_timeout 2s;
    location / {
        set $reverb_upstream reverb:8080;
        proxy_pass http://$reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
