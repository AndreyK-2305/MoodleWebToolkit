name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check committed whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          echo "Checked-out HEAD: $(git rev-parse HEAD)"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            test -n "$PR_BASE_SHA"
            git cat-file -e "${PR_BASE_SHA}^{commit}"
            echo "Checking PR range: ${PR_BASE_SHA}...HEAD"
            # BaseLine contains source-owned trailing blank lines; preserve its
            # bytes and verify it with the dedicated canonical integrity gate.
            git diff --check "${PR_BASE_SHA}...HEAD" -- . ':(exclude)BaseLine/**'
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git cat-file -e "${BEFORE_SHA}^{commit}"
            echo "Checking push range: ${BEFORE_SHA}..${CURRENT_SHA}"
            git diff --check "${BEFORE_SHA}..${CURRENT_SHA}" -- . ':(exclude)BaseLine/**'
          else
            echo "Checking current commit: ${CURRENT_SHA}"
            git show --check --format= --no-renames "$CURRENT_SHA" -- . ':(exclude)BaseLine/**'
          fi

      - name: Configure documented Docker Hub cache on the empty CI runner
        shell: bash
        run: bash ./tests/Infrastructure/configure-ci-registry.sh

      - name: Clean installation and all quality gates including Playwright
        shell: pwsh
        run: ./tests/Infrastructure/run-quality.ps1 -ProjectName mt1g-ci

      - name: Preserve failure evidence temporarily
        if: always() && (failure() || cancelled())
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-failure-${{ github.sha }}
          path: quality-results/
          retention-days: 3

      - name: Preserve successful validation with exact published SHA
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iteration2-validation-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            quality-results/iteration2-validation.json
            quality-results/health.json
            quality-results/final-health.json
            quality-results/phpunit.xml
            quality-results/playwright.xml
          if-no-files-found: error
          retention-days: 30

      - name: Ensure isolated stack is stopped even after interruption
        if: always()
        env:
          QUALITY_APP_KEY: teardown-only
          QUALITY_DB_PASSWORD: teardown-only
          QUALITY_REVERB_SECRET: teardown-only
        run: docker compose -f compose.quality.yaml -p mt1g-ci --profile e2e down -v --remove-orphans

  collector-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact published code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Configure documented Docker Hub cache on the empty CI runner
        shell: bash
        run: bash ./tests/Infrastructure/configure-ci-registry.sh

      - name: Synthetic Moodle, copied collector contracts and real browser flow
        shell: pwsh
        run: ./tests/Infrastructure/run-quality.ps1 -ProjectName mt1g-it3-ci -CollectorLab
      - name: Preserve failure evidence temporarily
        if: always() && (failure() || cancelled())
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: collector-lab-failure-${{ github.event.pull_request.head.sha || github.sha }}
          # Cancellation can bypass PowerShell catch. Uninspected XML are
          # published only by the success artifact after the real-secret scan.
          path: |
            quality-results/**
            !quality-results/collector-lab-phpunit.xml
            !quality-results/collector-lab-playwright.xml
          retention-days: 3
      - name: Preserve real integration validation with exact published SHA
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iteration3-lab-validation-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            quality-results/iteration3-lab-validation.json
            quality-results/collector-lab-health.json
            quality-results/collector-lab-final-health.json
            quality-results/collector-lab-phpunit.xml
            quality-results/collector-lab-playwright.xml
            quality-results/collector-contracts.json
            quality-results/collector-resilience.json
            quality-results/collector-report-hygiene.json
            quality-results/collector-report-hygiene-contracts.json
          if-no-files-found: error
          retention-days: 30
      - name: Ensure isolated LAB stack is stopped even after interruption
        if: always()
        env:
          QUALITY_APP_KEY: teardown-only
          QUALITY_DB_PASSWORD: teardown-only
          QUALITY_REVERB_SECRET: teardown-only
        run: docker compose -f compose.quality.yaml -f compose.collector-lab.yaml -p mt1g-it3-ci --profile e2e down -v --remove-orphans
