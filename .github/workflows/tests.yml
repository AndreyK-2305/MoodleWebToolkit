name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Clean installation and all quality gates including Playwright
        shell: pwsh
        run: ./tests/Infrastructure/run-quality.ps1 -ProjectName mt1g-ci

      - name: Preserve failure evidence temporarily
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-failure-${{ github.sha }}
          path: quality-results/
          retention-days: 3

      - name: Ensure isolated stack is stopped even after interruption
        if: always()
        env:
          QUALITY_APP_KEY: teardown-only
          QUALITY_DB_PASSWORD: teardown-only
          QUALITY_REVERB_SECRET: teardown-only
        run: docker compose -f compose.quality.yaml -p mt1g-ci down -v --remove-orphans
