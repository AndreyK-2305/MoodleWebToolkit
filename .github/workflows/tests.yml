name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and start the application stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Run migrations
        run: docker compose exec -T app php artisan migrate:fresh --force --no-interaction

      - name: Run PHP checks
        run: |
          docker compose exec -T app composer lint:check
          docker compose exec -T app composer types:check
          docker compose exec -T app php artisan test

      - name: Run frontend checks
        run: |
          docker compose exec -T vite npm run check
          docker compose exec -T vite npm run lint
          docker compose exec -T vite npm run types:check
          docker compose exec -T vite npm run build

      - name: Verify protected baseline
        shell: pwsh
        run: |
          ./tests/Infrastructure/verify-baseline-integrity.ps1
          ./tests/Infrastructure/verify-baseline-readonly.ps1

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop application stack
        if: always()
        run: docker compose down -v --remove-orphans
